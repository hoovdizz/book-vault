name: Build and publish container

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/book-vault:${{ github.ref_name == 'main' && 'latest' || 'development' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container health and Unraid ownership
        shell: bash
        run: |
          config_dir="$(mktemp -d)"
          container_name="book-vault-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --volume "$config_dir:/config" \
            --env PUID=99 \
            --env PGID=100 \
            --env ADMIN_NAME=bookvaultadmin \
            --env ADMIN_EMAIL=admin@bookvault.local \
            --env ADMIN_PASSWORD=bookvaultpassword \
            "$IMAGE_TAG"

          healthy=false
          for _ in {1..30}; do
            if docker exec "$container_name" wget -q -O - http://127.0.0.1:8130/api/health | grep -q '"status":"ok"'; then
              healthy=true
              break
            fi
            sleep 1
          done

          test "$healthy" = "true"
          test "$(stat -c '%u:%g' "$config_dir")" = "99:100"
          test "$(stat -c '%u:%g' "$config_dir/book-vault.sqlite")" = "99:100"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Publish scanned image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
