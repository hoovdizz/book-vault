<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#241713">
    <title>Book Vault is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #1f1411; color: #fff8f1; }
      main { width: min(90vw, 32rem); text-align: center; }
      img { width: 5rem; height: 5rem; border-radius: 1rem; }
      button { min-height: 44px; padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #f3a65a; color: #241713; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/book-vault-icon.png" alt="">
      <h1>Book Vault is offline</h1>
      <p>The application shell is available, but Book Vault does not cache credentials, private notes, or administrative data. Reconnect to open the household catalog.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
