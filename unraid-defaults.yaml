name: BookVault
repository: ghcr.io/hoovdizz/book-vault
tag: development
network: bridge
web_ui: http://[IP]:[PORT:8130]
ports:
  - container: 8130
    host: 8130
    protocol: tcp
paths:
  - container: /config
    host: /mnt/user/appdata/book-vault
    access: read-write
environment:
  TZ: America/New_York
  DATABASE_PATH: /config/book-vault.sqlite
  SESSION_DAYS: "30"
  ADMIN_NAME: bookvaultadmin
  ADMIN_EMAIL: admin@bookvault.local
  ADMIN_PASSWORD: bookvaultpassword
