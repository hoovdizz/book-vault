name: BookVault
repository: ghcr.io/hoovdizz/book-vault
tag: development
network: bridge
web_ui: http://[IP]:[PORT:8130]
icon: https://raw.githubusercontent.com/hoovdizz/book-vault/development/public/book-vault-icon.png
ports:
  - container: 8130
    host: 8130
    protocol: tcp
paths:
  - container: /config
    host: /mnt/user/appdata/book-vault
    access: read-write
environment:
  TZ: America/New_York
  PUID: "99"
  PGID: "100"
  DATABASE_PATH: /config/book-vault.sqlite
  GOOGLE_BOOKS_API_KEY: ""
  HARDCOVER_API_TOKEN: ""
  BOOK_LOOKUP_TIMEOUT_MS: "6000"
  SESSION_DAYS: "30"
  TRUST_PROXY: "false"
  ADMIN_NAME: bookvaultadmin
  ADMIN_EMAIL: admin@bookvault.local
  # Required on first run. Set a unique value; Book Vault has no default password.
  ADMIN_PASSWORD: ""
