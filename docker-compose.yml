services:
  book-vault:
    build: .
    image: ghcr.io/hoovdizz/book-vault:development
    container_name: book-vault
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/hoovdizz/book-vault/development/public/book-vault-icon.png"
    restart: unless-stopped
    ports:
      - "8130:8130"
    volumes:
      - ./config:/config
    environment:
      TZ: America/New_York
      PORT: "8130"
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      DATABASE_PATH: /config/book-vault.sqlite
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:-}"
      HARDCOVER_API_TOKEN: "${HARDCOVER_API_TOKEN:-}"
      BOOK_LOOKUP_TIMEOUT_MS: "6000"
      ADMIN_NAME: bookvaultadmin
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Set ADMIN_EMAIL in your environment}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your environment}"
      SESSION_DAYS: "30"
